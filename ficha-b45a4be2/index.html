.cardio-grid label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;font-weight:600;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;font-weight:600;color:var(--muted)}
.bf{margin-top:14px;border-top:1px solid var(--line);padding-top:8px}
@media (prefers-reduced-motion:no-preference){.panel{animation:in .2s ease-out}@keyframes in{from{opacity:.4}to{opacity:1}}}

<script>

const ORDER=['seg','ter','qua','qui','sex','sab','dom'];
const MOB=[['Abertura de quadril (posição 90/90)','2 × 60 s cada lado'],['Rotação de coluna torácica no chão','2 × 10 cada lado'],['Alongamento de peitoral na porta','2 × 30 s cada lado'],['Mobilidade de ombro com elástico ou bastão','2 × 10'],['Tornozelo (joelho na parede)','2 × 10 cada lado'],['Gato e camelo','2 × 10']];

/* ---------- estado e gravação ---------- */
let S={ui:{tab:'resumo',day:'seg',phase:'f',week:1},d:{}};
let docRef=null,saving=false,dirty=false,timer=null;
const LS='ficha-tiago-v1';
const $=s=>document.querySelector(s);
const OKV=/^[-+]?[\d.,eE+-]{1,24}$/;
function lsRead(){
  try{
    const o=JSON.parse(localStorage.getItem(LS)||'null');
    if(!o||typeof o!=='object')return null;
    const d={};
    if(o.d&&typeof o.d==='object')for(const k of Object.keys(o.d)){const v=o.d[k];if((typeof v==='string'||typeof v==='number')&&OKV.test(String(v)))d[k]=String(v)}
    const u=o.ui&&typeof o.ui==='object'?o.ui:{},ui={};
    if(['resumo','treino','corpo','dieta'].includes(u.tab))ui.tab=u.tab;
    if(ORDER.includes(u.day))ui.day=u.day;
    if(u.phase==='f'||u.phase==='h')ui.phase=u.phase;
    if(Number.isInteger(u.week)&&u.week>=1&&u.week<=40)ui.week=u.week;
    return {ui,d};
  }catch(_){return null}
}
const esc=t=>String(t).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
let lsOk=true;
function lsWrite(){try{localStorage.setItem(LS,JSON.stringify(S));lsOk=true}catch(_){lsOk=false}}
function status(t){const el=$('#status');if(el)el.textContent=t}
function schedule(){lsWrite();dirty=true;clearTimeout(timer);timer=setTimeout(flush,900);status(lsOk?'Salvando…':'Não foi possível salvar neste aparelho')}
async function flush(){
  if(saving){timer=setTimeout(flush,500);return}
  if(!dirty)return;
  if(!docRef){dirty=false;status(lsOk?'Salvo só neste aparelho':'Não foi possível salvar neste aparelho');return}
  saving=true;dirty=false;
  try{await docRef.set({ui:S.ui,d:JSON.stringify(S.d)});status('Salvo')}catch(er){status('Não salvou na nuvem'+(er&&er.code?' ('+er.code+')':'')+'. Fica só neste aparelho.')}
  saving=false;
  if(dirty)timer=setTimeout(flush,300);
}
function get(k){return esc(S.d[k]??'')}
function prev(build,w){for(let i=w-1;i>=1;i--){const v=S.d[build(i)];if(v!==undefined)return esc(v)}return ''}

/* ---------- telas ---------- */
const fmt=n=>n.toLocaleString('pt-BR');

function viewResumo(){return `
<section class="panel">

      <li><b>Gasto parado:</b> fórmula de Mifflin St Jeor, a mais usada por nutricionistas. 10 × 80 kg + 6,25 × 171 cm − 5 × 23 anos + 5 = 1.759 kcal.</li>

    <p class="small muted" style="margin-top:10px">São estimativas, com erro de até 10%. A conferência real é pesar toda manhã e medir a cintura toda semana (aba Cardio e corpo).</p>

    <h3>Base científica</h3>
    <ul class="plain small" style="margin-top:10px">
      <li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5477153" target="_blank" rel="noopener">Posição da Sociedade Internacional de Nutrição Esportiva sobre proteína</a>: 1,4 a 2,0 g por kg para ganhar e manter músculo, e faixas mais altas para quem treina e está em déficit.</li>
      <li><a href="https://pubmed.ncbi.nlm.nih.gov/28630601/" target="_blank" rel="noopener">Posição da mesma sociedade sobre dietas e composição corporal</a>: a perda de gordura vem de um déficit de calorias mantido, e perder mais devagar preserva o músculo.</li>
      <li><a href="https://pubmed.ncbi.nlm.nih.gov/27102172/" target="_blank" rel="noopener">Revisão sobre frequência de treino</a>: treinar cada músculo 2 vezes por semana rende mais hipertrofia do que 1 vez.</li>
      <li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8884877/" target="_blank" rel="noopener">Revisão sobre volume semanal</a>: de 10 a 20 séries por músculo por semana é a faixa mais indicada.</li>
      <li><a href="https://pescience.com/blogs/articles/does-fasted-cardio-accelerate-fat-loss/" target="_blank" rel="noopener">Resumo sobre cardio em jejum</a>: queima um pouco mais de gordura durante o exercício, mas a perda total é igual à do cardio com comida quando as calorias do dia são as mesmas.</li>
    </ul>
  </div>
</section>`}

function viewTreino(){
  const u=S.ui,day=DAYS[u.day],w=u.week,F=u.phase==='f';
  const ctrl=`
  <div class="controls">
    <div class="days" role="group" aria-label="Dia da semana">${ORDER.map(k=>`<button class="pill ${DAYS[k].rest?'rest':''}" data-day="${k}" aria-pressed="${u.day===k}">${DAYS[k].abbr}</button>`).join('')}</div>
    <div class="row" style="justify-content:space-between">
      <div class="row" role="group" aria-label="Fase do treino">
        <button class="pill" data-phase="f" aria-pressed="${F}">Força</button>
        <button class="pill" data-phase="h" aria-pressed="${!F}">Hipertrofia</button>
      </div>
      <div class="week"><button data-wk="-1" aria-label="Semana anterior">−</button><output>Semana ${w}</output><button data-wk="1" aria-label="Próxima semana">+</button></div>
    </div>
  </div>`;
  let body;
  if(day.rest){
    body=`<div class="card"><p class="label">${day.nome}</p><h2>${day.foco}</h2><p>${day.desc}</p>
      ${u.day==='qua'?`<p>Faça o cardio da manhã normalmente, sem esforço forte. À tarde, 15 minutos de mobilidade:</p>
      <div class="scroll"><table>${MOB.map(m=>`<tr><td>${m[0]}</td><td class="num">${m[1]}</td></tr>`).join('')}</table></div>`:`<p>Cardio livre. Se sentir o corpo pesado, pode pular.</p>`}</div>`;
  }else{
    body=`<div class="card"><p class="label">${day.nome} às 17h · fase ${F?'Força':'Hipertrofia'}</p><h2>${day.foco}</h2><p class="muted" style="margin:0">${day.desc}. ${F?'Peso alto, descanso longo, 1 a 2 repetições sobrando.':'Controle a descida, sinta o músculo, 1 a 2 repetições sobrando.'}</p></div>`+
    day.ex.map(x=>{
      const c=F?x.f:x.h;
      let rows='';
      for(let i=0;i<c[0];i++){
        const kk=`${w}|${x.id}|${i}|kg`,rk=`${w}|${x.id}|${i}|r`;
        const pk=prev(n=>`${n}|${x.id}|${i}|kg`,w),pr=prev(n=>`${n}|${x.id}|${i}|r`,w);
        rows+=`<span class="n">${i+1}</span>
        <input class="f" id="i-${x.id}-${i}-kg" data-k="${kk}" type="number" inputmode="decimal" step="0.5" min="0" placeholder="${pk||'kg'}" value="${get(kk)}" aria-label="${x.n}, série ${i+1}, carga em kg">
        <input class="f" id="i-${x.id}-${i}-r" data-k="${rk}" type="number" inputmode="numeric" step="1" min="0" placeholder="${pr||'reps'}" value="${get(rk)}" aria-label="${x.n}, série ${i+1}, repetições">`;
      }
      return `<article class="ex"><header><h3>${x.n}</h3><span class="scheme num">${c[0]} × ${c[1]} · ${c[2]}</span></header>
      <div class="sets"><span class="h">Série</span><span class="h">Carga (kg)</span><span class="h">Repetições</span>${rows}</div></article>`;
    }).join('');
  }
  return `<section class="panel">${ctrl}${body}</section>`;
}

function viewCorpo(){
  const w=S.ui.week;
  const wk=`<div class="week"><button data-wk="-1" aria-label="Semana anterior">−</button><output>Semana ${w}</output><button data-wk="1" aria-label="Próxima semana">+</button></div>`;
  const pk=prev(n=>`b|${n}|peso`,w),ck=prev(n=>`b|${n}|cint`,w);
  return `<section class="panel">
  <div class="row" style="justify-content:space-between"><h2 style="margin:0">Cardio e corpo</h2>${wk}</div>
  <div class="card">
    <h3>Cardio da manhã, em jejum</h3>
    <ul class="plain" style="margin-top:10px">
      <li><b>O que fazer:</b> caminhada na esteira com inclinação de 8 a 12% a 5,5 a 6,5 km/h, ou bicicleta. O ritmo certo é aquele em que você ainda consegue conversar.</li>
      <li><b>Quanto:</b> 30 a 40 minutos, de segunda a sábado. Domingo livre.</li>
      <li><b>Antes:</b> água e, se quiser, café preto sem açúcar. O café com leite fica para depois do cardio, em até 1 hora.</li>
      <li><b>Se um dia não der para fazer em jejum:</b> sem problema. As pesquisas mostram que a perda de gordura no fim é igual quando a comida do dia é a mesma. O que conta é a soma da semana.</li>
      <li>Se sentir tontura ou fraqueza, coma algo leve e siga o dia.</li>
    </ul>
  </div>
  <div class="card">
    <h3>Minutos de cardio na semana ${w}</h3>
    <div class="cardio-grid" style="margin-top:10px">${ORDER.map(k=>{const kk=`c|${w}|${k}`;return `<label for="c-${k}">${DAYS[k].abbr}<input class="f" id="c-${k}" data-k="${kk}" type="number" inputmode="numeric" min="0" step="5" placeholder="min" value="${get(kk)}"></label>`}).join('')}</div>
  </div>
  <div class="card">
    <h3>Medidas e gordura da semana ${w}</h3>
    <p class="small muted">Uma vez por semana, no mesmo dia, de manhã, em jejum e depois do banheiro. Cintura: fita na altura do umbigo, sem apertar nem encolher a barriga. Pescoço: logo abaixo do gogó. Balança: o percentual de gordura que a balança da academia mostrar.</p>
    <div class="two"><label for="b-peso">Peso (kg)<input class="f" id="b-peso" data-k="b|${w}|peso" type="number" inputmode="decimal" step="0.1" placeholder="${pk||'kg'}" value="${get(`b|${w}|peso`)}"></label>
    <label for="b-cint">Cintura (cm)<input class="f" id="b-cint" data-k="b|${w}|cint" type="number" inputmode="decimal" step="0.5" placeholder="${ck||'cm'}" value="${get(`b|${w}|cint`)}"></label>
    <label for="b-pesc">Pescoço (cm)<input class="f" id="b-pesc" data-k="b|${w}|pesc" type="number" inputmode="decimal" step="0.5" placeholder="cm" value="${get(`b|${w}|pesc`)}"></label>
    <label for="b-bal">Gordura da balança (%)<input class="f" id="b-bal" data-k="b|${w}|bal" type="number" inputmode="decimal" step="0.1" placeholder="%" value="${get(`b|${w}|bal`)}"></label>
    <label for="b-alt">Altura (cm)<input class="f" id="b-alt" data-k="cfg|alt" type="number" inputmode="decimal" step="1" placeholder="171" value="${get('cfg|alt')}"></label>
    <label for="b-meta">Meta de gordura (%)<input class="f" id="b-meta" data-k="cfg|meta" type="number" inputmode="decimal" step="0.5" placeholder="14" value="${get('cfg|meta')}"></label></div>
    <div id="bf-out" class="bf" aria-live="polite"></div>
  </div>
  <div class="card"><h3>Histórico</h3><div class="scroll" id="hist"></div></div>
  <div class="card">
    <h3>Como ajustar</h3>
    <ul class="plain" style="margin-top:10px">
      <li>Média de peso não caiu em 2 semanas: tire cerca de 150 kcal (um pouco menos de arroz e de pão).</li>
      <li>Perdendo mais de 1 kg por semana, ou treino sem força: acrescente 150 kcal.</li>
      <li>Cintura caindo mesmo com peso parado é sinal bom: pode ser músculo subindo e gordura descendo.</li>
    </ul>
  </div>
  </section>`;
}
const f1=n=>n.toFixed(1).replace('.',',');
function num(v){const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?null:n}
/* Gordura pelo método da Marinha dos EUA (medidas em cm) e pela balança */
function bfFor(w){
  const a0=num(S.d['cfg|alt']),alt=a0!==null&&a0>=120&&a0<=230?a0:171;
  const pos=x=>x!==null&&isFinite(x)&&x>0?x:null;
  const c=pos(num(S.d[`b|${w}|cint`])),p=pos(num(S.d[`b|${w}|pesc`])),kg=pos(num(S.d[`b|${w}|peso`]));
  const okPct=x=>x!==null&&isFinite(x)&&x>0&&x<70?x:null;
  let fita=null;
  if(c!==null&&p!==null&&c>p)fita=okPct(495/(1.0324-0.19077*Math.log10(c-p)+0.15456*Math.log10(alt))-450);
  const bal=okPct(num(S.d[`b|${w}|bal`]));
  const v=[fita,bal].filter(x=>x!==null);
  return {fita,bal,pct:v.length?v.reduce((x,y)=>x+y)/v.length:null,kg};
}
function faixa(g){return g<6?'abaixo da faixa de atleta':g<14?'faixa de atleta':g<18?'em forma':g<25?'aceitável':'obesidade'}
function calcGordura(){
  const el=$('#bf-out');if(!el)return;
  const r=bfFor(S.ui.week),m0=num(S.d['cfg|meta']),meta=m0!==null&&m0>=3&&m0<=60?m0:14;
  if(r.pct===null){el.innerHTML='<p class="muted small" style="margin:0">Preencha cintura e pescoço, ou a gordura da balança, e o cálculo aparece aqui.</p>';return}
  let h='<table>';
  if(r.fita!==null)h+=`<tr><td>Pela fita métrica</td><td class="num"><b>${f1(r.fita)}%</b></td></tr>`;
  if(r.bal!==null)h+=`<tr><td>Pela balança</td><td class="num"><b>${f1(r.bal)}%</b></td></tr>`;
  h+=`<tr><td>Valor usado${r.fita!==null&&r.bal!==null?' (média das duas)':''}</td><td class="num"><b>${f1(r.pct)}%</b> <span class="muted small">${faixa(r.pct)}</span></td></tr>`;
  if(r.kg!==null){
    const gord=r.kg*r.pct/100,magra=r.kg-gord,alvo=magra/(1-meta/100),perder=Math.max(0,r.kg-alvo);
    h+=`<tr><td>Gordura no corpo</td><td class="num">${f1(gord)} kg</td></tr><tr><td>Massa magra (músculo, ossos, água)</td><td class="num">${f1(magra)} kg</td></tr>`;
    h+=`<tr><td>Peso na meta de ${f1(meta)}%</td><td class="num"><b>${f1(alvo)} kg</b></td></tr><tr><td>Gordura a perder</td><td class="num">${f1(perder)} kg (cerca de ${Math.ceil(perder/0.5)} semanas)</td></tr>`;
  }else h+='<tr><td colspan="2" class="muted small">Anote o peso da semana para ver quanta gordura você tem e o peso na meta.</td></tr>';
  el.innerHTML=h+'</table><p class="small muted" style="margin:8px 0 0">Estimativa. A balança varia com a água do corpo, então compare sempre na mesma condição e olhe a tendência das semanas.</p>';
}
function renderHist(){
  const el=$('#hist');if(!el)return;
  const rows=[];
  for(let i=1;i<=40;i++){const p=S.d[`b|${i}|peso`],c=S.d[`b|${i}|cint`],g=bfFor(i).pct;if(p||c||g!=null)rows.push(`<tr><td>Semana ${i}</td><td class="num">${num(p)!==null?f1(num(p))+' kg':'—'}</td><td class="num">${num(c)!==null?f1(num(c))+' cm':'—'}</td><td class="num">${g!=null?f1(g)+'%':'—'}</td></tr>`)}
  el.innerHTML=rows.length?`<table><tr><th>Semana</th><th>Peso</th><th>Cintura</th><th>Gordura</th></tr>${rows.join('')}</table>`:'<p class="muted small" style="margin:0">As medidas que você anotar aparecem aqui.</p>';
}

function meal(t,nome,txt,m){return `<div class="meal"><div class="t">${t}</div><div><h3>${nome}</h3><div>${txt}</div></div><div class="macros num">≈ ${m}</div></div>`}
function viewDieta(){return `
<section class="panel">
  <div class="grid4">
    <div class="stat hl"><b class="num">2.200</b><span>kcal por dia</span></div>
    <div class="stat"><b class="num">175 g</b><span>proteína (2,2 g por kg de peso)</span></div>
    <div class="stat"><b class="num">210 g</b><span>carboidrato</span></div>
    <div class="stat"><b class="num">70 g</b><span>gordura</span></div>
  </div>
  <div class="card">
    <h2>Um dia completo</h2>
    <p class="small muted">Montado só com o que costuma ter na sua casa. Almoço e janta seguem o que sua mãe faz, e você controla a porção do prato.</p>
    ${meal('7h','Cardio em jejum','Água, e café preto sem açúcar se quiser.','0 kcal')}
    ${meal('8h','Café da manhã','3 ovos mexidos (pouca margarina na frigideira) + 2 fatias de pão de forma + café com 200 ml de leite.','460 kcal · proteína 30 · carbo 35 · gordura 23')}
    ${meal('12h30','Almoço','4 colheres de servir de arroz, 1 concha cheia de feijão, 150 g de frango (peito ou coxa sem pele) ou porco magro, salada à vontade. Evite a parte gordurosa e a pele.','585 kcal · proteína 52 · carbo 62 · gordura 15')}
    ${meal('15h30','Lanche antes do treino','Café com 200 ml de leite + 2 fatias de pão de forma + 1 pote de iogurte. Opcional: 1 colher de sopa de pó de beterraba em água, 45 minutos antes do treino.','370 kcal · proteína 15 · carbo 52 · gordura 11')}
    ${meal('18h30','Depois do treino','1 dose de whey (30 g) com água.','120 kcal · proteína 24 · carbo 3 · gordura 2')}
    ${meal('19h30','Janta','<b>Se não tiver janta:</b> sanduíche com 3 fatias de pão de forma, 2 ovos, 2 fatias de mussarela e salada.<br><b>Se tiver macarrão:</b> 1 prato raso de macarrão com molho vermelho + 100 g de carne ou 2 ovos + salada.<br><b>Se tiver sopa:</b> 1 prato fundo com carne e legumes + 2 fatias de pão de forma.','455 kcal · proteína 30 · carbo 36 · gordura 22')}
    ${meal('22h','Ceia','1 pote de iogurte com 1 dose de whey (30 g) misturada.','240 kcal · proteína 29 · carbo 21 · gordura 5')}
    <p class="num" style="margin:12px 0 0"><b>Total do dia: cerca de 2.230 kcal, proteína 180 g, carbo 209 g, gordura 77 g.</b></p>
  </div>
  <div class="card">
    <h3>Trocas que mantêm o plano</h3>
    <div class="scroll"><table style="margin-top:8px">
      <tr><th>Em vez de</th><th>Pode comer</th></tr>
      <tr><td>2 fatias de pão de forma</td><td>1 pão de sal</td></tr>
      <tr><td>Pão doce</td><td>Só no fim de semana, 1 por dia no máximo. Tem muito açúcar e pouca proteína.</td></tr>
      <tr><td>3 ovos</td><td>2 ovos + 1 fatia de queijo, ou 1 dose de whey no café com leite</td></tr>
      <tr><td>Manteiga ou margarina</td><td>Uma camada fina (1 colher de chá, cerca de 35 kcal). Passar muito vira calorias escondidas.</td></tr>
      <tr><td>Açúcar no café</td><td>Adoçante, ou 1 colher de chá (20 kcal)</td></tr>
      <tr><td>Leite pasteurizado integral</td><td>Se achar o semidesnatado, melhor ainda</td></tr>
    </table></div>
  </div>
  <div class="card">
    <h3>Regras que mais pesam no resultado</h3>
    <ul class="plain" style="margin-top:10px">
      <li><b>Proteína em toda refeição.</b> Ovo, frango, queijo, leite, iogurte e whey cobrem isso.</li>

      <li><b>Uma refeição livre por semana</b>, sem culpa e sem exagero. Isso ajuda a manter o plano por meses.</li>

  </div>

</section>`}

/* ---------- render ---------- */
const VIEWS={resumo:viewResumo,treino:viewTreino,corpo:viewCorpo,dieta:viewDieta};
function render(){
  const t=S.ui.tab;
  document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===t)));
  $('#main').innerHTML=VIEWS[t]();
  if(t==='corpo'){renderHist();calcGordura()}
}
document.addEventListener('click',ev=>{
  const b=ev.target.closest('button');if(!b)return;
  const d=b.dataset;let ch=false;
  if(d.tab){S.ui.tab=d.tab;ch=true;window.scrollTo(0,0)}
  else if(d.day){S.ui.day=d.day;ch=true}
  else if(d.phase){S.ui.phase=d.phase;ch=true}
  else if(d.wk){S.ui.week=Math.min(40,Math.max(1,S.ui.week+Number(d.wk)));ch=true}
  if(ch){render();schedule()}
});
document.addEventListener('input',ev=>{
  const k=ev.target.dataset&&ev.target.dataset.k;if(!k)return;
  if(ev.target.validity&&ev.target.validity.badInput)return;
  const v=ev.target.value.trim();
  if(v==='')delete S.d[k];else S.d[k]=v;
  if(k.startsWith('b|')||k.startsWith('cfg|')){renderHist();calcGordura()}
  schedule();
});

/* ---------- início ---------- */
(function(){
  const l=lsRead();
  if(l&&l.d){S={ui:Object.assign(S.ui,l.ui||{}),d:l.d}}
  render();
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(_){}
  window.addEventListener('storage',ev=>{if(ev.key===LS&&!(document.activeElement&&document.activeElement.dataset&&document.activeElement.dataset.k)){const n=lsRead();if(n){S={ui:Object.assign(S.ui,n.ui),d:n.d};render()}}});
  status(lsOk?'Salvo neste aparelho':'Não foi possível salvar neste aparelho');
})();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
