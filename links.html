<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiago Borges | CTO</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0D0D0D;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                radial-gradient(ellipse at top, #1a1a2e 0%, transparent 50%),
                radial-gradient(ellipse at bottom, #0a1628 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
        }

        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }

        /* Foto de perfil */
        .profile-photo {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            position: relative;
        }

        .profile-photo::before {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 50%;
            background: linear-gradient(135deg, #7B2CBF, #2563EB);
            z-index: -1;
        }

        .profile-photo img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #0D0D0D;
        }

        /* Informações do perfil */
        .profile-info {
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .profile-name {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 28px;
            font-weight: 700;
            color: #FFFFFF;
        }

        .profile-handle {
            font-size: 16px;
            color: #B4B4B4;
        }

        .profile-title {
            font-size: 14px;
            color: #7B2CBF;
            font-weight: 500;
        }

        /* Links */
        .links {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 16px;
        }

        .link-button {
            display: flex;
            align-items: center;
            gap: 16px;
            width: 100%;
            padding: 16px 24px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #FFFFFF;
            text-decoration: none;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .link-button::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(123, 44, 191, 0.2), rgba(37, 99, 235, 0.2));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .link-button:hover {
            transform: translateY(-2px);
            border-color: rgba(123, 44, 191, 0.5);
            box-shadow: 0 8px 32px rgba(123, 44, 191, 0.2);
        }

        .link-button:hover::before {
            opacity: 1;
        }

        .link-button svg {
            width: 24px;
            height: 24px;
            flex-shrink: 0;
            position: relative;
            z-index: 1;
        }

        .link-button span {
            position: relative;
            z-index: 1;
        }

        .link-whatsapp:hover {
            border-color: #25D366;
            box-shadow: 0 8px 32px rgba(37, 211, 102, 0.2);
        }

        .link-whatsapp svg {
            fill: #25D366;
        }

        .link-linkedin:hover {
            border-color: #0A66C2;
            box-shadow: 0 8px 32px rgba(10, 102, 194, 0.2);
        }

        .link-linkedin svg {
            fill: #0A66C2;
        }

        /* Rodapé */
        .footer {
            margin-top: 32px;
            text-align: center;
            color: #B4B4B4;
            font-size: 12px;
        }

        @media (max-width: 480px) {
            .profile-name {
                font-size: 24px;
            }

            .link-button {
                padding: 14px 20px;
                font-size: 15px;
            }

            .profile-photo {
                width: 120px;
                height: 120px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Foto de Perfil -->
        <div class="profile-photo">

        <div class="profile-info">

            <p class="profile-handle">@tiagoborges.dev</p>

        </div>

        <!-- Rodapé -->
        <div class="footer">
            <p>IA • Automações • Web</p>
        </div>
    </div>
</body>
</html>
